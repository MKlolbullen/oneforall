services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reconforge
      POSTGRES_PASSWORD: reconforge
      POSTGRES_DB: reconforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reconforge
      MINIO_ROOT_PASSWORD: reconforge-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://reconforge:reconforge@postgres:5432/reconforge
      REDIS_URL: redis://redis:6379/0
      RUNNER_MODE: queue
      TOOL_REGISTRY_DIR: /app/tool-registry/tools
      PROFILE_REGISTRY_DIR: /app/tool-registry/profiles
      PLATFORM_CONFIG_PATH: /app/platform-config/sniper-inspired.yaml
      GREP_PATTERNS_PATH: /app/patterns/sniper-grep-patterns.yaml
      WORDLISTS_DIR: /app/wordlists
      ARTIFACT_BACKEND: s3
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: reconforge
      MINIO_SECRET_KEY: reconforge-secret
      MINIO_BUCKET: artifacts
    ports:
      - "8000:8000"
    volumes:
      - ./packages/tool-registry:/app/tool-registry:ro
      - ./packages/platform-config:/app/platform-config:ro
      - ./packages/patterns:/app/patterns:ro
      - ./packages/wordlists:/app/wordlists:ro
      - api-artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      WORKER_NAME: runner-1
      DATABASE_URL: postgresql+psycopg://reconforge:reconforge@postgres:5432/reconforge
      REDIS_URL: redis://redis:6379/0
      RUNNER_MODE: queue
      TOOL_REGISTRY_DIR: /app/tool-registry/tools
      PROFILE_REGISTRY_DIR: /app/tool-registry/profiles
      PLATFORM_CONFIG_PATH: /app/platform-config/sniper-inspired.yaml
      GREP_PATTERNS_PATH: /app/patterns/sniper-grep-patterns.yaml
      WORDLISTS_DIR: /app/wordlists
      ARTIFACT_BACKEND: s3
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: reconforge
      MINIO_SECRET_KEY: reconforge-secret
      MINIO_BUCKET: artifacts
    volumes:
      - ./packages/tool-registry:/app/tool-registry:ro
      - ./packages/platform-config:/app/platform-config:ro
      - ./packages/patterns:/app/patterns:ro
      - ./packages/wordlists:/app/wordlists:ro
      - api-artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_BASE_URL: ws://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  api-artifacts:
