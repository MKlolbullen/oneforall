[project]
name = "reconforge-api"
version = "0.1.0"
description = "FastAPI control plane for ReconForge"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.4.0",
  "PyYAML>=6.0.2",
  "python-multipart>=0.0.9",
  "redis>=5.0.8",
  "boto3>=1.35.0",
  "alembic>=1.13.0",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Setuptools' flat-layout auto-discovery refuses to ship a package when there
# are multiple top-level dirs (we have both `app/` and `alembic/`). Declare
# the package list explicitly so pip install -e . works on every setuptools
# version we care about.
[tool.setuptools]
packages = ["app", "app.api", "app.api.routes", "app.core", "app.services"]
