name: CI

on:
  push:
    # Run on main and on every working branch so the 305-test suite
    # exercises feature work before merge. CI on main alone meant
    # multi-commit branches landed without ever running CI.
    branches: [ "main", "claude/**", "feature/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  legacy-oneforall:
    name: legacy oneforall (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install legacy package
        working-directory: legacy
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt
          pip install -e .
      - name: Flake8 (syntax / undefined-name only)
        working-directory: legacy
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: pytest
        working-directory: legacy
        run: pytest -v

  reconforge-api:
    name: reconforge api (305-test suite)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Install pytest deps
        run: pip install pytest httpx ruff
      - name: Ruff (touched paths only)
        # Limit to the modules + tests we own — pre-existing E402 lint
        # in services/runner.py is unrelated to anything new.
        run: |
          ruff check apps/api/app/services/scope.py \
                     apps/api/app/services/scope_engine.py \
                     apps/api/app/services/roe_guard.py \
                     apps/api/app/services/argv_extractor.py \
                     apps/api/app/services/reports.py \
                     apps/api/app/services/loot.py \
                     apps/api/app/services/target_validation.py \
                     apps/api/app/api/routes/scope.py \
                     apps/api/app/api/routes/runs.py \
                     apps/api/app/api/routes/webhooks.py \
                     apps/api/app/api/routes/workflows.py \
                     apps/api/app/api/routes/agent.py \
                     apps/api/app/api/routes/loot.py \
                     apps/api/app/api/routes/search.py \
                     tests/test_scope_engine.py \
                     tests/test_scope_poc.py \
                     tests/test_scope_evaluate.py \
                     tests/test_roe_guard_wired.py \
                     tests/test_argv_extractor.py \
                     tests/test_reports.py \
                     tests/test_loot.py \
                     tests/test_webhooks.py \
                     tests/test_search.py \
                     tests/test_workflows.py \
                     tests/test_adhoc_workflow.py \
                     tests/test_target_validation.py \
                     tests/test_agent_brief.py \
                     tests/test_user_admin.py
      - name: Reconforge full suite (registry, e2e dry-run, ROE, reports, webhooks, search…)
        env:
          DATABASE_URL: sqlite:///./reconforge.db
          REDIS_URL: redis://localhost:6379/0
          ARTIFACT_BACKEND: local
          ARTIFACT_DIR: ./artifacts
          EXECUTION_MODE: dry_run
          ALLOW_LIVE_EXECUTION: "false"
          RUNNER_MODE: in_process
          # 0 keeps CI fast (~2-3 min instead of 4-5); the dry-run delay
          # is purely cosmetic for live demos and shaving it on CI is
          # the difference between a 12-minute and a 4-minute build.
          DRY_RUN_LINE_DELAY_SECONDS: "0"
        run: python -m pytest tests/ -q

  web-build:
    name: web (tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web deps
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Type-check + bundle
        working-directory: apps/web
        run: npm run build

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config > /dev/null

  runner-image-build:
    name: build runner image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build runner image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile.runner
          push: false
          load: true
          tags: reconforge-runner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test pinned binaries
        run: |
          set -ux
          missing=()
          for bin in subfinder dnsx httpx naabu nuclei katana urlfinder \
                     amass assetfinder gau hakrawler dalfox tlsx asnmap \
                     gowitness ffuf cariddi chaos uncover gospider \
                     gauplus waybackurls qsreplace gf nmap; do
            if ! docker run --rm --entrypoint sh reconforge-runner:ci -c "command -v $bin >/dev/null 2>&1"; then
              missing+=("$bin")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing binaries in runner image: ${missing[*]}"
            exit 1
          fi
          echo "all expected binaries present"
