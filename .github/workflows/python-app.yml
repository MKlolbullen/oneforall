name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  legacy-oneforall:
    name: legacy oneforall (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install legacy package
        working-directory: legacy
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt
          pip install -e .
      - name: Flake8 (syntax / undefined-name only)
        working-directory: legacy
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: pytest
        working-directory: legacy
        run: pytest -v

  reconforge-api:
    name: reconforge api (import smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Install pytest deps
        run: pip install pytest httpx
      - name: Reconforge tests (registry, e2e dry-run, DAG artifact passing)
        env:
          DATABASE_URL: sqlite:///./reconforge.db
          REDIS_URL: redis://localhost:6379/0
          ARTIFACT_BACKEND: local
          ARTIFACT_DIR: ./artifacts
          EXECUTION_MODE: dry_run
          ALLOW_LIVE_EXECUTION: "false"
          RUNNER_MODE: in_process
        run: python -m pytest tests/ -v

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config > /dev/null
