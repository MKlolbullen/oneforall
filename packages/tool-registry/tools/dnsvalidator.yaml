id: dnsvalidator
name: DNSValidator
category: resolution
description: vortexau DNSValidator generates a list of accurate, untainted public DNS resolvers.
binary: dnsvalidator
risk: passive
requires_authorization: false
inputs:
- name: target
  type: file_path
  required: true
outputs:
- name: resolvers
  type: finding_list
command:
  argv:
  - dnsvalidator
  - -tL
  - '{{target}}'
  - -threads
  - '20'
  - -o
  - /artifacts/resolvers.txt
parser:
  type: line_based
  entity: ip
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- dns
- resolvers
- recon
install:
  method: pipx
  package: dnsvalidator
dry_run_output:
- '1.1.1.1'
- '8.8.8.8'
