description: Legacy screenshot capture utility.
risk: low_active
requires_authorization: true
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: output
  type: text
parser:
  type: line_based
  entity: text
default_timeout_seconds: 900
max_retries: 0
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- screenshot
- legacy
install:
  method: apt
  package: cutycapt
dry_run_output:
- 'screenshot: /tmp/cutycapt.png'
id: cutycapt
name: CutyCapt
category: screenshots
binary: cutycapt
command:
  argv:
  - cutycapt
  - --url=https://{{target}}
  - --out=/tmp/cutycapt.png
