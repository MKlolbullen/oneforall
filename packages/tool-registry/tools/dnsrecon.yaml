id: dnsrecon
name: dnsrecon
category: resolution
description: DNS enumeration and zone-transfer checks.
binary: dnsrecon
risk: low_active
requires_authorization: true
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: dns_records
  type: text
command:
  argv:
  - dnsrecon
  - -d
  - '{{target}}'
  - -a
parser:
  type: line_based
  entity: finding
default_timeout_seconds: 1200
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- dns
- zone-transfer
- records
install:
  method: apt
  package: dnsrecon
dry_run_output:
- '[*] Zone transfer test failed as expected'
- ns1.example.com
