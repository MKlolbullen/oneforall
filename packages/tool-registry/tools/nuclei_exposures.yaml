id: nuclei_exposures
name: Nuclei Exposures
category: vulnerability-scanning
description: Nuclei exposure/misconfiguration template profile.
binary: nuclei
risk: medium_active
requires_authorization: true
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - nuclei
  - -silent
  - -jsonl
  - -u
  - https://{{target}}
  - -tags
  - exposure,misconfig,files
parser:
  type: json_lines
  entity: finding
default_timeout_seconds: 3600
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- projectdiscovery
- nuclei
- exposure
install:
  method: go_install
  package: github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
dry_run_output:
- '{"template-id":"exposed-env","matched-at":"https://www.example.com/.env","info":{"name":"Exposed env
  file","severity":"high"}}'
