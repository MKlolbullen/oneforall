id: impacket_secretsdump
name: "Impacket: secretsdump"
category: lateral-movement
description: "Remote SAM / LSA / NTDS.dit dumping via DRSUAPI / shadow copies."
binary: impacket-secretsdump
risk: high_active
requires_authorization: true
inputs:
- name: target
  type: ip_or_host
  required: true
outputs:
- name: results
  type: text
command:
  argv:
  - "impacket-secretsdump"
  - "-just-dc-ntlm"
  - "{{target}}"
parser:
  type: line_based
  entity: raw
default_timeout_seconds: 1800
max_retries: 0
retry_backoff_seconds: 2.0
continue_on_error: false
tags:
- impacket
- credential-dump
- active-directory
install:
  method: pipx
  package: "impacket"
dry_run_output:
- "[*] Dumping Domain Credentials (domain\\uid:rid:lmhash:nthash)"
- "domain\\Administrator:500:aad3b435b51404eeaad3b435b51404ee:31d6cfe0d16ae931b73c59d7e0c089c0:::"
