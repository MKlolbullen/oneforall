id: subdomainizer
name: SubDomainizer
category: javascript
description: Pull subdomains and embedded secrets from JavaScript and HTML pages.
binary: subdomainizer
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: subdomains
  type: domain_list
- name: findings
  type: finding_list
command:
  argv:
  - subdomainizer
  - -u
  - https://{{target}}
  - -k
parser:
  type: line_based
  entity: domain
default_timeout_seconds: 900
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- javascript
- subdomain
- secrets
install:
  method: pipx
  package: subdomainizer
dry_run_output:
- api.example.com
- '[secret] AWS_ACCESS_KEY found in main.js'
