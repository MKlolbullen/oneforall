id: uddup
name: uddup
category: content_discovery
description: rotemreiss uddup dedupes URL lists by path, query parameters and fragments.
binary: uddup
risk: passive
requires_authorization: false
inputs:
- name: target
  type: file_path
  required: true
outputs:
- name: urls
  type: url_list
command:
  argv:
  - uddup
  - -u
  - '{{target}}'
  - -s
parser:
  type: line_based
  entity: url
default_timeout_seconds: 600
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- url
- dedup
- recon
install:
  method: pipx
  package: uddup
dry_run_output:
- 'https://www.example.com/search?q=FUZZ'
- 'https://www.example.com/user/FUZZ'
