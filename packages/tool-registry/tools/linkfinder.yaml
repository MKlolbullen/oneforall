id: linkfinder
name: LinkFinder
category: javascript-analysis
description: JavaScript endpoint extraction.
binary: linkfinder
risk: low_active
requires_authorization: true
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: endpoints
  type: url_list
command:
  argv:
  - linkfinder
  - -i
  - https://{{target}}
  - -o
  - cli
parser:
  type: line_based
  entity: url
default_timeout_seconds: 1200
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- javascript
- endpoints
install:
  method: manual
  notes: Install LinkFinder in a dedicated Python venv.
dry_run_output:
- /api/v1/users
- /internal/status
