id: oneforall_s10_report
name: "OneForAll s10_report"
category: reconnaissance
description: "Generate Markdown + HTML report from findings.json"
binary: python
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: findings
  type: json
command:
  argv:
  - python
  - -m
  - oneforall
  - s10_report
  - -d
  - '{{target}}'
  - --workspace
  - /app/artifacts/oneforall
parser:
  type: line_based
  entity: raw
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 2.0
continue_on_error: false
tags:
- oneforall
- legacy
- s10_report
install:
  method: pip_install
  package: -e ./legacy
dry_run_output:
- "[s10_report] start"
- "[s10_report] done"
