id: cero
name: "cero"
category: external-intel
description: "Discover hostnames from TLS certificates inside an IP range."
binary: cero
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: results
  type: text
command:
  argv:
  - "cero"
  - "{{target}}"
parser:
  type: line_based
  entity: raw
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 2.0
continue_on_error: false
tags:
- tls
- passive
- asn
install:
  method: go_install
  package: "github.com/glebarez/cero@latest"
dry_run_output:
- "api.example.com"
- "console.example.com"
