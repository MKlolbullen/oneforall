id: nuclei_cves
name: Nuclei CVEs
category: vulnerability-scanning
description: Nuclei CVE-tagged template profile.
binary: nuclei
risk: medium_active
requires_authorization: true
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - nuclei
  - -silent
  - -jsonl
  - -u
  - https://{{target}}
  - -tags
  - cve
parser:
  type: json_lines
  entity: finding
default_timeout_seconds: 5400
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- projectdiscovery
- nuclei
- cve
install:
  method: go_install
  package: github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
dry_run_output:
- '{"template-id":"CVE-2021-41773","matched-at":"https://www.example.com","info":{"name":"Apache path
  traversal check","severity":"critical"}}'
