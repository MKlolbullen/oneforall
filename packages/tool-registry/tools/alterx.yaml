id: alterx
name: alterx
category: permutation
description: ProjectDiscovery subdomain permutation generator.
binary: alterx
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: candidate_subdomains
  type: domain_list
command:
  argv:
  - alterx
  - -silent
  - -d
  - '{{target}}'
parser:
  type: line_based
  entity: domain
default_timeout_seconds: 900
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- projectdiscovery
- permutation
- dns
install:
  method: go_install
  package: github.com/projectdiscovery/alterx/cmd/alterx@latest
dry_run_output:
- dev-api.example.com
- api-dev.example.com
