id: kube_bench
name: kube-bench
category: cloud
description: Aqua kube-bench CIS Kubernetes benchmark checker.
binary: kube-bench
risk: passive
requires_authorization: false
inputs:
- name: target
  type: file_path
  required: true
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - kube-bench
  - run
  - --config-dir
  - '{{target}}'
  - --json
parser:
  type: json
  entity: finding
default_timeout_seconds: 1200
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- kubernetes
- cis
- aqua
install:
  method: manual
  package: aquasecurity/kube-bench
dry_run_output:
- '{"Controls":[{"id":"1","tests":[{"results":[{"test_number":"1.1.1","status":"FAIL"}]}]}]}'
