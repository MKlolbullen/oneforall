id: oneforall_s02_active
name: "OneForAll s02_active"
category: reconnaissance
description: "Active DNS recon (subfinder, assetfinder, chaos, amass, nextnet) + httpx liveness"
binary: python
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: findings
  type: json
command:
  argv:
  - python
  - -m
  - oneforall
  - s02_active
  - -d
  - '{{target}}'
  - --workspace
  - /app/artifacts/oneforall
parser:
  type: line_based
  entity: raw
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 2.0
continue_on_error: false
tags:
- oneforall
- legacy
- s02_active
install:
  method: pip_install
  package: -e ./legacy
dry_run_output:
- "[s02_active] start"
- "[s02_active] done"
