id: batchql
name: BatchQL
category: api
description: assetnote BatchQL GraphQL security audit for batching and DoS misconfigurations.
binary: batchql
risk: medium_active
requires_authorization: true
inputs:
- name: target
  type: url
  required: true
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - batchql
  - -e
  - https://{{target}}/graphql
parser:
  type: line_based
  entity: finding
default_timeout_seconds: 1200
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- graphql
- api
- dos
install:
  method: manual
  package: assetnote/batchql
dry_run_output:
- '[+] Alias-based batching supported (potential DoS vector)'
