id: sherlock
name: Sherlock
category: osint
description: Sherlock username enumeration across hundreds of social networks.
binary: sherlock
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: profiles
  type: finding_list
command:
  argv:
  - sherlock
  - '{{target}}'
  - --print-found
  - --no-color
parser:
  type: line_based
  entity: finding
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- osint
- username
- social
install:
  method: pipx
  package: sherlock-project
dry_run_output:
- '[+] GitHub: https://github.com/example'
- '[+] Reddit: https://reddit.com/user/example'
