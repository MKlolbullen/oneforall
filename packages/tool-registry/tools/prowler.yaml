id: prowler
name: "Prowler"
category: cloud-security
description: "Multi-cloud security & compliance auditor (AWS, Azure, GCP, Kubernetes)."
binary: prowler
risk: high_active
requires_authorization: true
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: results
  type: text
command:
  argv:
  - "prowler"
  - "aws"
  - "--quick-inventory"
  - "--output-modes"
  - "json-asff"
parser:
  type: line_based
  entity: raw
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 2.0
continue_on_error: false
tags:
- cloud
- audit
- compliance
install:
  method: pipx
  package: "prowler"
dry_run_output:
- "{\"check_id\":\"iam_root_mfa_enabled\",\"status\":\"FAIL\",\"severity\":\"high\"}"
- "{\"check_id\":\"s3_bucket_public_access_block\",\"status\":\"PASS\",\"severity\":\"medium\"}"
