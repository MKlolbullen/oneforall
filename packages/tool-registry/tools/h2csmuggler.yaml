id: h2csmuggler
name: h2csmuggler
category: vulnerability
description: BishopFox h2csmuggler tests for HTTP/2 cleartext (h2c) smuggling vulnerabilities that bypass front-end proxies.
binary: h2csmuggler
risk: medium_active
requires_authorization: true
inputs:
- name: target
  type: url
  required: true
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - h2csmuggler
  - -x
  - '{{target}}'
  - -p
  - '{{target}}/admin'
parser:
  type: line_based
  entity: finding
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- vulnerability
- http2
- smuggling
install:
  method: manual
  package: BishopFox/h2csmuggler
dry_run_output:
- '[VULN] HTTP/2 cleartext upgrade succeeded on https://www.example.com'
- 'HTTP/1.1 200 OK - smuggled response received'
