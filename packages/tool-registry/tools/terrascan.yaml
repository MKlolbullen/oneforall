id: terrascan
name: Terrascan
category: infrastructure_as_code
description: Tenable Terrascan IaC compliance and security scanner.
binary: terrascan
risk: passive
requires_authorization: false
inputs:
- name: target
  type: file_path
  required: true
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - terrascan
  - scan
  - -d
  - '{{target}}'
  - -o
  - json
parser:
  type: json
  entity: finding
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- iac
- terraform
- compliance
install:
  method: manual
  package: tenable/terrascan
dry_run_output:
- '{"results":{"violations":[{"rule_id":"AC_AWS_0001","severity":"HIGH","resource_name":"my_bucket"}]}}'
