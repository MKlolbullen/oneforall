id: ppfuzz
name: ppfuzz
category: javascript
description: Orhun prototype pollution fuzzer for client-side JS endpoints.
binary: ppfuzz
risk: medium_active
requires_authorization: true
inputs:
- name: target
  type: url
  required: true
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - ppfuzz
  - -l
  - '{{target}}'
parser:
  type: line_based
  entity: finding
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- javascript
- prototype-pollution
- fuzzing
install:
  method: manual
  package: orhun/ppfuzz
dry_run_output:
- 'https://www.example.com/?__proto__[polluted]=true [vulnerable]'
