description: Legacy application server fingerprinting and checks.
risk: medium_active
requires_authorization: true
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: output
  type: text
parser:
  type: line_based
  entity: text
default_timeout_seconds: 900
max_retries: 0
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- appserver
- legacy
install:
  method: source
  package: clusterd
dry_run_output:
- 'clusterd: dry-run fingerprint placeholder'
id: clusterd
name: clusterd
category: vulnerability-scanning
binary: clusterd
command:
  argv:
  - clusterd
  - -i
  - '{{target}}'
