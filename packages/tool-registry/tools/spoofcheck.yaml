description: SPF/DMARC/DKIM anti-spoofing posture checks.
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: output
  type: text
parser:
  type: line_based
  entity: text
default_timeout_seconds: 900
max_retries: 0
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- email-security
- spf
- dmarc
- dkim
install:
  method: python_stdlib
dry_run_output:
- 'SPF: present'
- 'DMARC: p=none'
id: spoofcheck
name: spoofcheck
category: email-security
binary: python3
command:
  argv:
  - python3
  - -c
  - print("SPF/DMARC/DKIM placeholder for {{target}}")
