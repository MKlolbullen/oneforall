id: gitleaks_detect
name: Gitleaks Detect
category: secrets
description: Secret scanning for cloned repositories or mounted artifact trees.
binary: gitleaks
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - gitleaks
  - detect
  - --source
  - /artifacts/input
  - --no-banner
  - --report-format
  - json
parser:
  type: json_lines
  entity: finding
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- secrets
- git
- supply-chain
install:
  method: go_install
  package: github.com/gitleaks/gitleaks/v8@latest
dry_run_output:
- '{"Description":"Generic API Key","File":"config.js","Secret":"REDACTED"}'
