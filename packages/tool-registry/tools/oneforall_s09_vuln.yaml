id: oneforall_s09_vuln
name: "OneForAll s09_vuln"
category: reconnaissance
description: "Vulnerability scanning (gated): xsstrike, dalfox, nuclei"
binary: python
risk: high_active
requires_authorization: true
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: findings
  type: json
command:
  argv:
  - python
  - -m
  - oneforall
  - s09_vuln
  - -d
  - '{{target}}'
  - --workspace
  - /app/artifacts/oneforall
  - --i-have-authorization
parser:
  type: line_based
  entity: raw
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 2.0
continue_on_error: false
tags:
- oneforall
- legacy
- s09_vuln
install:
  method: pip_install
  package: -e ./legacy
dry_run_output:
- "[s09_vuln] start"
- "[s09_vuln] done"
