id: gau
name: gau
category: url-discovery
description: Fetch URLs from public archives.
binary: gau
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: urls
  type: url_list
command:
  argv:
  - gau
  - --subs
  - '{{target}}'
parser:
  type: line_based
  entity: url
default_timeout_seconds: 1200
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- urls
- archive
install:
  method: go_install
  package: github.com/lc/gau/v2/cmd/gau@latest
dry_run_output:
- https://www.example.com/index.html
- https://api.example.com/v1/search?q=test
