id: apkleaks
name: "APKleaks"
category: secrets
description: "Static analysis tool for scanning APK files for URIs, endpoints and secrets."
binary: apkleaks
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: results
  type: text
command:
  argv:
  - "apkleaks"
  - "-f"
  - "{{target}}"
  - "--json"
parser:
  type: line_based
  entity: raw
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 2.0
continue_on_error: false
tags:
- mobile
- android
- secrets
install:
  method: pipx
  package: "apkleaks"
dry_run_output:
- "{\"name\":\"AWS_ACCESS_KEY\",\"matches\":[\"AKIA...\"]}"
