description: Email breach intelligence lookup. Requires explicit legal basis for real
  data.
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: output
  type: text
parser:
  type: line_based
  entity: text
default_timeout_seconds: 900
max_retries: 0
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- osint
- email
- breach
install:
  method: pipx
  package: h8mail
dry_run_output:
- 'security@example.com: no dry-run breach data'
id: h8mail
name: h8mail
category: osint
binary: h8mail
command:
  argv:
  - h8mail
  - -t
  - security@{{target}}
