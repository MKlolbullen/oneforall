id: mapcidr
name: mapcidr
category: network-intel
description: CIDR expansion, slicing and aggregation utility.
binary: mapcidr
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: ips
  type: ip_list
command:
  argv:
  - mapcidr
  - -silent
  - -cidr
  - '{{target}}'
parser:
  type: line_based
  entity: ip
default_timeout_seconds: 900
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- projectdiscovery
- cidr
- utility
install:
  method: go_install
  package: github.com/projectdiscovery/mapcidr/cmd/mapcidr@latest
dry_run_output:
- 203.0.113.10
- 203.0.113.11
