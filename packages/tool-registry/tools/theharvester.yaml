description: Email, subdomain and people OSINT from public sources.
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: output
  type: text
parser:
  type: line_based
  entity: text
default_timeout_seconds: 900
max_retries: 0
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- osint
- email
- domains
install:
  method: apt_or_pipx
  package: theHarvester
dry_run_output:
- 'host: mail.example.com'
- 'email: security@example.com'
id: theharvester
name: theHarvester
category: osint
binary: theHarvester
command:
  argv:
  - theHarvester
  - -d
  - '{{target}}'
  - -b
  - all
