id: github_subdomains
name: GitHub Subdomains
category: reconnaissance
description: Search GitHub code for leaked subdomain references.
binary: github-subdomains
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: subdomains
  type: domain_list
command:
  argv:
  - github-subdomains
  - -d
  - '{{target}}'
  - -silent
parser:
  type: line_based
  entity: domain
default_timeout_seconds: 900
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: true
tags:
- subdomain
- osint
- api-key
install:
  method: go_install
  package: github.com/gwen001/github-subdomains@latest
dry_run_output:
- internal-api.example.com
- mobile-api.example.com
