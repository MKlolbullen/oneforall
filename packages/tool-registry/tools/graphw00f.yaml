id: graphw00f
name: graphw00f
category: api-security
description: GraphQL engine fingerprinting.
binary: graphw00f
risk: low_active
requires_authorization: true
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: fingerprints
  type: finding_list
command:
  argv:
  - graphw00f
  - -t
  - https://{{target}}/graphql
parser:
  type: line_based
  entity: finding
default_timeout_seconds: 900
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- graphql
- fingerprint
- api
install:
  method: pipx
  package: graphw00f
dry_run_output:
- 'GraphQL detected: Apollo Server'
