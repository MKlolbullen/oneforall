description: Web technology fingerprinting.
risk: low_active
requires_authorization: true
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: output
  type: text
parser:
  type: line_based
  entity: text
default_timeout_seconds: 900
max_retries: 0
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- fingerprinting
- tech
install:
  method: pipx
  package: webtech
dry_run_output:
- '{"tech":["nginx","react"]}'
id: webtech
name: webtech
category: fingerprinting
binary: webtech
command:
  argv:
  - webtech
  - -u
  - https://{{target}}
  - --json
