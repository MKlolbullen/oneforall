id: jsluice
name: jsluice
category: javascript
description: BishopFox jsluice extracts URLs, paths and secrets from JavaScript source.
binary: jsluice
risk: passive
requires_authorization: false
inputs:
- name: target
  type: file_path
  required: true
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - jsluice
  - urls
  - '{{target}}'
parser:
  type: jsonl
  entity: url
default_timeout_seconds: 600
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- javascript
- urls
- secrets
- bishopfox
install:
  method: go_install
  package: github.com/BishopFox/jsluice/cmd/jsluice@latest
dry_run_output:
- '{"kind":"url","url":"/api/v1/users","method":"GET","filename":"app.js"}'
- '{"kind":"secret","value":"sk_live_redacted","filename":"app.js"}'
