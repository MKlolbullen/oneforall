id: amass_active
name: Amass Active
category: active_recon
description: OWASP Amass active enumeration mode using DNS bruteforce and certificate grabs.
binary: amass
risk: low_active
requires_authorization: true
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: subdomains
  type: domain_list
command:
  argv:
  - amass
  - enum
  - -active
  - -brute
  - -d
  - '{{target}}'
parser:
  type: line_based
  entity: domain
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 30.0
continue_on_error: false
tags:
- owasp
- subdomain
- active
install:
  method: go_install
  package: github.com/owasp-amass/amass/v4/...@v4.2.1
dry_run_output:
- dev.example.com
- staging.example.com
