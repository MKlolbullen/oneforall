id: cloudfox
name: "CloudFox"
category: cloud-security
description: "Offensive cloud-security utility for AWS recon and lateral-movement enumeration."
binary: cloudfox
risk: high_active
requires_authorization: true
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: results
  type: text
command:
  argv:
  - "cloudfox"
  - "aws"
  - "all-checks"
parser:
  type: line_based
  entity: raw
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 2.0
continue_on_error: false
tags:
- cloud
- aws
- offensive
install:
  method: go_install
  package: "github.com/BishopFox/cloudfox@latest"
dry_run_output:
- "[+] Found IAM principal: arn:aws:iam::000000000000:user/lab"
