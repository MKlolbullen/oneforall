description: Typo-squatting and domain permutation intelligence.
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: output
  type: text
parser:
  type: line_based
  entity: text
default_timeout_seconds: 900
max_retries: 0
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- typosquatting
- domain-permutation
install:
  method: apt_or_gem
  package: urlcrazy
dry_run_output:
- examp1e.com
- examplle.com
id: urlcrazy
name: urlcrazy
category: osint
binary: urlcrazy
command:
  argv:
  - urlcrazy
  - '{{target}}'
