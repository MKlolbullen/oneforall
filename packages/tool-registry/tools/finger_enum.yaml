description: Finger service query if exposed.
risk: low_active
requires_authorization: true
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: output
  type: text
parser:
  type: line_based
  entity: text
default_timeout_seconds: 900
max_retries: 0
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- finger
- network
install:
  method: apt
  package: finger
dry_run_output:
- No one logged on.
id: finger_enum
name: finger
category: network-security
binary: finger
command:
  argv:
  - finger
  - '@{{target}}'
