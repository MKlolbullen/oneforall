id: puredns_resolve
name: puredns Resolve
category: resolution
description: High-throughput DNS resolution with trusted resolvers and wildcard handling.
binary: puredns
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: resolved_domains
  type: domain_list
command:
  argv:
  - puredns
  - resolve
  - '{{target}}'
  - --quiet
parser:
  type: line_based
  entity: domain
default_timeout_seconds: 1200
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- dns
- resolve
- wildcard
install:
  method: go_install
  package: github.com/d3mondev/puredns/v2@latest
dry_run_output:
- api.example.com
- www.example.com
