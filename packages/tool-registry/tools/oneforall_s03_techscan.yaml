id: oneforall_s03_techscan
name: "OneForAll s03_techscan"
category: reconnaissance
description: "Tech stack & port scanning (naabu -> nmap -sV -> whatweb)"
binary: python
risk: medium_active
requires_authorization: true
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: findings
  type: json
command:
  argv:
  - python
  - -m
  - oneforall
  - s03_techscan
  - -d
  - '{{target}}'
  - --workspace
  - /app/artifacts/oneforall
  - --i-have-authorization
parser:
  type: line_based
  entity: raw
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 2.0
continue_on_error: false
tags:
- oneforall
- legacy
- s03_techscan
install:
  method: pip_install
  package: -e ./legacy
dry_run_output:
- "[s03_techscan] start"
- "[s03_techscan] done"
