id: anew
name: anew
category: dedupe
description: Append-new-lines-only dedupe utility.
binary: anew
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: deduped_lines
  type: text
command:
  argv:
  - anew
  - /tmp/reconforge-anew.txt
parser:
  type: line_based
  entity: raw
default_timeout_seconds: 300
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- dedupe
- utility
- tomnomnom
install:
  method: go_install
  package: github.com/tomnomnom/anew@latest
dry_run_output:
- api.example.com
