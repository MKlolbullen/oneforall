id: whatweb
name: WhatWeb
category: fingerprinting
description: Web technology fingerprinting.
binary: whatweb
risk: low_active
requires_authorization: true
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: technologies
  type: technology_list
command:
  argv:
  - whatweb
  - --color=never
  - https://{{target}}
parser:
  type: line_based
  entity: finding
default_timeout_seconds: 900
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- fingerprint
- technology
- web
install:
  method: apt
  package: whatweb
dry_run_output:
- https://www.example.com [200 OK] nginx, HTML5, JQuery
