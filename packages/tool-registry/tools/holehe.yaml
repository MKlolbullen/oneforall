id: holehe
name: Holehe
category: osint
description: megadose Holehe enumerates accounts associated with a given email address.
binary: holehe
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: accounts
  type: finding_list
command:
  argv:
  - holehe
  - '{{target}}'
  - --only-used
  - --no-color
parser:
  type: line_based
  entity: finding
default_timeout_seconds: 900
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- osint
- email
- accounts
install:
  method: pipx
  package: holehe
dry_run_output:
- '[+] github.com'
- '[+] twitter.com'
