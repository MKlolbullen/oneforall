id: cent
name: cent
category: vulnerability
description: xm1k3 cent community Nuclei template aggregator and updater.
binary: cent
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: templates
  type: artifact_list
command:
  argv:
  - cent
  - -p
  - /artifacts/templates
  - --no-banner
parser:
  type: line_based
  entity: finding
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- nuclei
- templates
- community
install:
  method: go_install
  package: github.com/xm1k3/cent@latest
dry_run_output:
- 'Updated 247 community templates'
