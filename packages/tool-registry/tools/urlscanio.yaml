description: Query urlscan.io intelligence for a domain.
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: output
  type: text
parser:
  type: line_based
  entity: text
default_timeout_seconds: 900
max_retries: 0
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- urlscan
- external-intel
- api
install:
  method: python_stdlib
  env:
  - URLSCAN_API_KEY
dry_run_output:
- 'urlscan result: https://www.example.com'
id: urlscanio
name: urlscan.io
category: external-intel
binary: python3
command:
  argv:
  - python3
  - -c
  - print("urlscan.io integration placeholder for {{target}}")
