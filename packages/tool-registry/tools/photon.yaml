id: photon
name: Photon
category: content_discovery
description: s0md3v Photon is a fast Python OSINT crawler that extracts URLs, endpoints, secrets and intel.
binary: photon
risk: low_active
requires_authorization: true
inputs:
- name: target
  type: url
  required: true
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - photon
  - -u
  - https://{{target}}
  - -l
  - '3'
  - -t
  - '10'
  - --stdout
  - urls
parser:
  type: line_based
  entity: url
default_timeout_seconds: 1200
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- crawler
- osint
- recon
install:
  method: pipx
  package: photon
dry_run_output:
- https://www.example.com/login
- https://www.example.com/api/v1/users
