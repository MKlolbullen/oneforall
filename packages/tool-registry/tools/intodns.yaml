description: DNS hygiene checks similar to IntoDNS findings.
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: output
  type: text
parser:
  type: line_based
  entity: text
default_timeout_seconds: 900
max_retries: 0
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- dns
- hygiene
install:
  method: apt_or_pipx
  package: dnsrecon
dry_run_output:
- NS records found
- MX records found
id: intodns
name: IntoDNS-style checks
category: dns-security
binary: dnsrecon
command:
  argv:
  - dnsrecon
  - -d
  - '{{target}}'
