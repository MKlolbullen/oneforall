id: gitdorker
name: "GitDorker"
category: external-intel
description: "Curated GitHub dork list runner \u2014 surfaces leaked secrets by org/keyword."
binary: gitdorker.py
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: results
  type: text
command:
  argv:
  - "gitdorker.py"
  - "-tf"
  - "tokens.txt"
  - "-q"
  - "{{target}}"
parser:
  type: line_based
  entity: raw
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 2.0
continue_on_error: false
tags:
- github
- osint
- secrets
install:
  method: manual
  package: ""
dry_run_output:
- "https://github.com/example/leak/blob/main/AWS_KEY"
