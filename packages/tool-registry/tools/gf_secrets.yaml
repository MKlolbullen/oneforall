id: gf_secrets
name: gf secrets
category: secrets
description: Run gf-style patterns over gathered output for secrets and interesting endpoints.
binary: gf
risk: passive
requires_authorization: false
inputs:
- name: target
  type: artifact_or_text
  required: false
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - gf
  - secrets
parser:
  type: line_based
  entity: finding
default_timeout_seconds: 600
max_retries: 0
retry_backoff_seconds: 1.0
continue_on_error: true
tags:
- patterns
- secrets
- post-processing
install:
  method: go_install
  package: github.com/tomnomnom/gf@latest
dry_run_output:
- '[info] possible api_key parameter in https://www.example.com/app.js'
