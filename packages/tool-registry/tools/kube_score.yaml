id: kube_score
name: kube-score
category: kubernetes
description: Zegl kube-score statically analyses Kubernetes manifests for best-practice and security violations.
binary: kube-score
risk: passive
requires_authorization: false
inputs:
- name: target
  type: file_path
  required: true
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - kube-score
  - score
  - '{{target}}'
  - --output-format
  - json
parser:
  type: json
  entity: finding
default_timeout_seconds: 600
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- kubernetes
- k8s
- best-practices
install:
  method: go_install
  package: github.com/zegl/kube-score/cmd/kube-score@latest
dry_run_output:
- '[{"object_name":"web","checks":[{"check":{"name":"container-resources"},"grade":1,"comments":[{"summary":"CPU limit is not set"}]}]}]'
