id: gauplus
name: gauplus
category: url-discovery
description: Fast historical URL collector alternative to gau.
binary: gauplus
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: urls
  type: url_list
command:
  argv:
  - gauplus
  - -t
  - '20'
  - '{{target}}'
parser:
  type: line_based
  entity: url
default_timeout_seconds: 1200
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- urls
- archives
- passive
install:
  method: go_install
  package: github.com/bp0lr/gauplus@latest
dry_run_output:
- https://www.example.com/login
- https://api.example.com/v1/users
