id: secretfinder
name: SecretFinder
category: secrets
description: JavaScript secret discovery using regex signatures.
binary: secretfinder
risk: low_active
requires_authorization: true
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - secretfinder
  - -i
  - https://{{target}}/app.js
  - -o
  - cli
parser:
  type: line_based
  entity: finding
default_timeout_seconds: 1200
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- javascript
- secrets
- regex
install:
  method: manual
  notes: Install SecretFinder in a Python venv; pair with JS collectors.
dry_run_output:
- '[High] Possible API key in app.js'
