description: Passive hostsearch-style public intelligence source.
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: output
  type: text
parser:
  type: line_based
  entity: text
default_timeout_seconds: 900
max_retries: 0
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- external-intel
- hostsearch
install:
  method: python_stdlib
dry_run_output:
- api.example.com
- vpn.example.com
id: hackertarget_hostsearch
name: HackerTarget hostsearch
category: external-intel
binary: python3
command:
  argv:
  - python3
  - -c
  - print("hackertarget hostsearch placeholder for {{target}}")
