id: sourcemapper
name: sourcemapper
category: javascript
description: Denis Tonkikh sourcemapper extracts original sources from exposed JavaScript source maps.
binary: sourcemapper
risk: low_active
requires_authorization: true
inputs:
- name: target
  type: url
  required: true
outputs:
- name: artifacts
  type: artifact_list
command:
  argv:
  - sourcemapper
  - -url
  - https://{{target}}
  - -output
  - /artifacts/output
parser:
  type: line_based
  entity: artifact
default_timeout_seconds: 1200
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- javascript
- sourcemap
- recon
install:
  method: go_install
  package: github.com/denandz/sourcemapper@latest
dry_run_output:
- 'Extracted 47 source files to /artifacts/output'
