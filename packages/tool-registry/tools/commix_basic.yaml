id: commix_basic
name: Commix Basic
category: injection-testing
description: Command injection validation profile. High-risk; requires explicit authorization.
binary: commix
risk: high_active
requires_authorization: true
inputs:
- name: target
  type: domain_or_url
  required: true
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - commix
  - -u
  - https://{{target}}/?q=test
  - --batch
  - --level=1
parser:
  type: line_based
  entity: finding
default_timeout_seconds: 3600
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- command-injection
- high-risk
- active
install:
  method: manual
  notes: Install Commix in isolated runner only.
dry_run_output:
- '[info] testing connection to target URL'
