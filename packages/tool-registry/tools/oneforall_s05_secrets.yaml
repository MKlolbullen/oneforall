id: oneforall_s05_secrets
name: "OneForAll s05_secrets"
category: reconnaissance
description: "Secret hunting: cariddi, gf json/secret patterns, jsubfinder, regex fallback"
binary: python
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: findings
  type: json
command:
  argv:
  - python
  - -m
  - oneforall
  - s05_secrets
  - -d
  - '{{target}}'
  - --workspace
  - /app/artifacts/oneforall
parser:
  type: line_based
  entity: raw
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 2.0
continue_on_error: false
tags:
- oneforall
- legacy
- s05_secrets
install:
  method: pip_install
  package: -e ./legacy
dry_run_output:
- "[s05_secrets] start"
- "[s05_secrets] done"
