id: freq
name: freq
category: content_discovery
description: takshal0 freq computes character frequency for detecting suspicious / DGA domains and tokens.
binary: freq
risk: passive
requires_authorization: false
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: findings
  type: finding_list
command:
  argv:
  - freq
  - -d
  - '{{target}}'
parser:
  type: line_based
  entity: finding
default_timeout_seconds: 600
max_retries: 1
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- dga
- entropy
- analysis
install:
  method: manual
  package: takshal0/freq
dry_run_output:
- 'example.com freq_score=5.2 (low)'
