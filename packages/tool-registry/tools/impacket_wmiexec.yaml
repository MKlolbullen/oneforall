id: impacket_wmiexec
name: "Impacket: wmiexec"
category: lateral-movement
description: "Semi-interactive shell over DCOM/WMI; no service or binary on disk."
binary: impacket-wmiexec
risk: high_active
requires_authorization: true
inputs:
- name: target
  type: ip_or_host
  required: true
outputs:
- name: results
  type: text
command:
  argv:
  - "impacket-wmiexec"
  - "{{target}}"
parser:
  type: line_based
  entity: raw
default_timeout_seconds: 1800
max_retries: 0
retry_backoff_seconds: 2.0
continue_on_error: false
tags:
- impacket
- wmi
- lateral-movement
install:
  method: pipx
  package: "impacket"
dry_run_output:
- "[*] WMI session opened."
- "C:\\>whoami"
- "domain\\admin"
