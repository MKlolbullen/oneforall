id: scoutsuite
name: "ScoutSuite"
category: cloud-security
description: "Multi-cloud security audit by NCC Group; produces an HTML report."
binary: scout
risk: high_active
requires_authorization: true
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: results
  type: text
command:
  argv:
  - "scout"
  - "aws"
  - "--no-browser"
  - "--report-name"
  - "{{target}}"
parser:
  type: line_based
  entity: raw
default_timeout_seconds: 1800
max_retries: 1
retry_backoff_seconds: 2.0
continue_on_error: false
tags:
- cloud
- audit
- aws
- azure
- gcp
install:
  method: pipx
  package: "scoutsuite"
dry_run_output:
- "[*] Generated scoutsuite-report-example.html"
