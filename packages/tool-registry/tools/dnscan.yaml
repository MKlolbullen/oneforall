description: DNS brute force/enumeration adapter.
risk: low_active
requires_authorization: true
inputs:
- name: target
  type: domain
  required: true
outputs:
- name: output
  type: text
parser:
  type: line_based
  entity: text
default_timeout_seconds: 900
max_retries: 0
retry_backoff_seconds: 1.0
continue_on_error: false
tags:
- dns
- bruteforce
install:
  method: pipx_or_git
  package: dnscan
dry_run_output:
- dev.example.com
- admin.example.com
id: dnscan
name: dnscan
category: resolution
binary: dnscan
command:
  argv:
  - dnscan
  - -d
  - '{{target}}'
  - -w
  - packages/wordlists/domains-quick.txt
