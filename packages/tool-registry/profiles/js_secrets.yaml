id: js_secrets
name: JS and Secrets Review
risk: low_active
description: Crawl JS-heavy targets and run endpoint/secret oriented tools.
steps:
- tool: httpx
  timeout_seconds: 900
  max_retries: 1
- tool: katana
  timeout_seconds: 2400
  max_retries: 1
- tool: cariddi
  timeout_seconds: 1800
  max_retries: 1
- tool: jsubfinder
  timeout_seconds: 1800
  max_retries: 1
  continue_on_error: true
- tool: gf_secrets
  timeout_seconds: 600
  max_retries: 0
  continue_on_error: true
