id: git_history_secret_hunt
name: Git-History Secret Hunt
risk: passive
description: |
  Multi-tool sweep across git history. Stage 1 fetches the .git tree if it's
  exposed on the target webroot (git_dumper) — this fails closed when the
  directory isn't reachable. Stages 2-5 run secret scanners over the
  recovered tree, then noseyparker re-scans with its own ruleset, githound
  checks for "interesting" string patterns, and gitleaks_history walks
  every commit looking for credentials that were once committed and later
  deleted (still in object storage).

  All steps are passive: no requests fire against the target after the
  initial git_dumper fetch, and that fetch is bounded by the runtime
  scope engine.
mitre:
  - T1213.003  # data from information repositories: code repositories
  - T1552.001  # unsecured credentials: credentials in files
chains_into:
  - secrets_supply_chain
steps:
  - tool: git_dumper
    timeout_seconds: 1800
    max_retries: 1
    continue_on_error: true
  - tool: trufflehog_git
    timeout_seconds: 2400
    max_retries: 1
  - tool: gitleaks_history
    timeout_seconds: 2400
    max_retries: 1
  - tool: noseyparker
    timeout_seconds: 1800
    max_retries: 1
    continue_on_error: true
  - tool: githound
    timeout_seconds: 1800
    max_retries: 1
    continue_on_error: true
