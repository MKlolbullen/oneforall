id: secrets_supply_chain
name: Secrets + Client Supply Chain
risk: low_active
description: JavaScript secret discovery, repo/artifact secret scanning and client dependency checks.
steps:
- tool: cariddi
  timeout_seconds: 1800
  max_retries: 1
  continue_on_error: true
- tool: jsubfinder
  timeout_seconds: 1800
  max_retries: 1
  continue_on_error: true
- tool: gf_secrets
  timeout_seconds: 600
  max_retries: 1
  continue_on_error: true
- tool: secretfinder
  timeout_seconds: 1200
  max_retries: 1
  continue_on_error: true
- tool: trufflehog_filesystem
  timeout_seconds: 1800
  max_retries: 1
  continue_on_error: true
- tool: gitleaks_detect
  timeout_seconds: 1800
  max_retries: 1
  continue_on_error: true
- tool: retirejs
  timeout_seconds: 1200
  max_retries: 1
  continue_on_error: true
