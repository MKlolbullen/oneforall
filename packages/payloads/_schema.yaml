# Canonical schema reference for payload packs.
# Documentation only — not loaded as a validator at runtime.

$schema: "http://json-schema.org/draft-07/schema#"
title: "OneForAll Payload Pack"
type: object
required: [id, name, version, category, description, payloads]
properties:
  id:
    type: string
    description: "Slug; must match filename without .yaml."
    pattern: "^[a-z0-9_]+$"
  name:
    type: string
  version:
    type: string
    description: "SemVer. Bump on payload changes."
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  category:
    type: string
    enum: [injection, traversal, ssrf, deserialisation, smuggling, misconfiguration, auth, recon]
  description:
    type: string
  mitre:
    type: array
    items: { type: string, pattern: "^T[0-9]{4}(\\.[0-9]{3})?$" }
  owasp_top10:
    type: array
    items: { type: string }
  references:
    type: array
    minItems: 1
    items: { type: string, format: uri }
  related_tools:
    type: array
    items: { type: string }
  chains:
    type: array
    items: { type: string }
  payloads:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, name, subcategory, encoding, severity_when_works, payload]
      properties:
        id:           { type: string, pattern: "^[a-z0-9_]+$" }
        name:         { type: string }
        subcategory:  { type: string }
        encoding:     { type: string, enum: [raw, url, base64, unicode, mixed, html_entities] }
        tech_targets: { type: array, items: { type: string } }
        severity_when_works:
          type: string
          enum: [critical, high, medium, low]
        payload:      { type: string }
        notes:        { type: [string, "null"] }
        source:       { type: string }
