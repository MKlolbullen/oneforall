id: subdomain_takeover_fingerprints
name: Subdomain Takeover Fingerprints
version: 1.0.0
category: recon
description: |
  Detection fingerprints for dangling DNS records that point at third-party
  services where an attacker can register the previously-claimed resource. Each
  "payload" here is a regex/substring + a CNAME hint indicating a candidate.
  This file feeds nuclei / subjack / nuclei-templates / can-i-take-over-xyz.
mitre:
  - T1583.001
owasp_top10:
  - A05:2021
references:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://github.com/projectdiscovery/nuclei-templates/tree/master/http/takeovers
  - https://0xpatrik.com/subdomain-takeover-basics/
related_tools:
  - subjack
  - subzy
  - nuclei
  - takeover
chains:
  - bug_bounty_full
  - recon
payloads:
  - id: aws_s3
    name: AWS S3 - NoSuchBucket
    subcategory: detection
    encoding: raw
    tech_targets: [aws]
    severity_when_works: high
    payload: |
      cname: s3.amazonaws.com
      body_regex: NoSuchBucket|The specified bucket does not exist
    notes: Vulnerable when bucket name unclaimed
    source: https://github.com/EdOverflow/can-i-take-over-xyz
  - id: aws_cloudfront
    name: AWS CloudFront - Bad request
    subcategory: detection
    encoding: raw
    tech_targets: [aws]
    severity_when_works: medium
    payload: |
      cname: cloudfront.net
      body_regex: Bad request|ERROR: The request could not be satisfied
    notes: Often false positives; verify manually
    source: https://github.com/EdOverflow/can-i-take-over-xyz
  - id: aws_elasticbeanstalk
    name: AWS Elastic Beanstalk
    subcategory: detection
    encoding: raw
    tech_targets: [aws]
    severity_when_works: high
    payload: |
      cname: elasticbeanstalk.com
      body_regex: NXDOMAIN|Host not found
    notes: null
    source: https://github.com/EdOverflow/can-i-take-over-xyz
  - id: github_pages
    name: GitHub Pages 404
    subcategory: detection
    encoding: raw
    tech_targets: [github]
    severity_when_works: high
    payload: |
      cname: github.io
      body_regex: There isn['']t a GitHub Pages site here
    notes: Claim by creating same-name repo + CNAME file
    source: https://github.com/EdOverflow/can-i-take-over-xyz
  - id: heroku
    name: Heroku - No such app
    subcategory: detection
    encoding: raw
    tech_targets: [heroku]
    severity_when_works: high
    payload: |
      cname: herokuapp.com
      body_regex: No such app|herokucdn.com/error-pages/no-such-app.html
    notes: null
    source: https://github.com/EdOverflow/can-i-take-over-xyz
  - id: azure_traffic_manager
    name: Azure Traffic Manager
    subcategory: detection
    encoding: raw
    tech_targets: [azure]
    severity_when_works: high
    payload: |
      cname: trafficmanager.net
      body_regex: This page is intentionally left blank|404 Not Found
    notes: null
    source: https://github.com/EdOverflow/can-i-take-over-xyz
  - id: azure_websites
    name: Azure Websites
    subcategory: detection
    encoding: raw
    tech_targets: [azure]
    severity_when_works: high
    payload: |
      cname: azurewebsites.net
      body_regex: 404 Web Site not found
    notes: null
    source: https://github.com/EdOverflow/can-i-take-over-xyz
  - id: azure_cloudapp
    name: Azure CloudApp NXDOMAIN
    subcategory: detection
    encoding: raw
    tech_targets: [azure]
    severity_when_works: high
    payload: |
      cname: cloudapp.net|cloudapp.azure.com
      dns: NXDOMAIN
    notes: Detect via DNS, not HTTP
    source: https://github.com/EdOverflow/can-i-take-over-xyz
  - id: shopify
    name: Shopify - sorry no store
    subcategory: detection
    encoding: raw
    tech_targets: [shopify]
    severity_when_works: medium
    payload: |
      cname: myshopify.com
      body_regex: Sorry, this shop is currently unavailable
