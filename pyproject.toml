[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oneforall"
version = "2.0.0"
description = "10-stage bug bounty / pentest automation, driven by a Claude Code subagent"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "colorama>=0.4.6",
]

[project.scripts]
oneforall = "oneforall.cli:main"

[tool.setuptools.packages.find]
include = ["oneforall*"]

[tool.setuptools.package-data]
oneforall = ["../templates/*.j2"]
